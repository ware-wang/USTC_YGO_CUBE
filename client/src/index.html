<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USTC-OnlineCube - 游戏王轮抽</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ====== LOBBY ====== -->
<div id="lobby" class="view active">
  <div class="lobby-container">
    <div class="brand-kicker">Yu-Gi-Oh! Cube Draft</div>
    <h1>USTC-OnlineCube</h1>
    <p class="subtitle">游戏王 Cube 轮抽 · 在线对战</p>

    <div class="card panel">
      <h2>创建房间</h2>
      <label>玩家昵称</label>
      <input type="text" id="createName" placeholder="输入昵称" maxlength="12">
      <label>房间名</label>
      <input type="text" id="createRoomName" placeholder="例如：今晚四人轮抽" maxlength="24">
      <label>房间密码 <small>(可选，不填则无密码)</small></label>
      <input type="text" id="createPassword" placeholder="留空则不设密码" maxlength="20">
      <label>选择 Cube</label>
      <select id="cubeSelect"><option value="">加载中...</option></select>
      <label>轮抽模式</label>
      <select id="draftMode" required>
        <option value="classic" selected>传统轮抽</option>
        <option value="flip">翻翻乐</option>
      </select>
      <div class="row">
        <div>
          <label>玩家数</label>
          <select id="maxPlayers">
            <option value="2">2</option><option value="3">3</option>
            <option value="4" selected>4</option><option value="5">5</option>
            <option value="6">6</option><option value="7">7</option>
            <option value="8">8</option><option value="9">9</option>
            <option value="10">10</option><option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>
      </div>
      <div id="classicOptions" class="mode-options">
        <div class="row">
          <div>
            <label>每人包数</label>
            <select id="packsPerPlayer">
              <option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4" selected>4</option>
              <option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option>
            </select>
          </div>
          <div>
            <label>每包张数</label>
            <select id="cardsPerPack">
              <option value="5">5</option><option value="10">10</option>
              <option value="15" selected>15</option><option value="20">20</option>
            </select>
          </div>
        </div>
      </div>
      <div id="flipOptions" class="mode-options hidden">
        <div class="row">
          <div>
            <label>目标张数</label>
            <input type="number" id="flipTargetCards" min="1" max="120" value="45">
          </div>
          <div>
            <label>每行卡数</label>
            <input type="number" id="flipMarketRowSize" min="1" max="8" value="4">
          </div>
        </div>
      </div>
      <button id="createBtn" class="btn-primary">创建房间</button>
      <label style="margin-top:12px;display:flex;align-items:center;gap:8px;font-size:0.9rem;cursor:pointer">
        <input type="checkbox" id="testMode">
        测试模式（一键快速轮抽 + 从轮抽池随机组测试卡组）
      </label>
    </div>

    <div class="divider"><span>或</span></div>

    <div class="card panel">
      <h2>加入房间</h2>
      <label>玩家昵称</label>
      <input type="text" id="joinName" placeholder="输入昵称" maxlength="12">
      <label>房间号</label>
      <div class="row">
        <input type="text" id="roomCode" placeholder="8位房间号" maxlength="8" style="flex:1">
        <button id="joinBtn" class="btn-secondary">加入</button>
      </div>
      <div id="joinPasswordRow" class="hidden">
        <label>房间密码 <small>(该房间设置了密码)</small></label>
        <div class="row">
          <input type="text" id="joinPassword" placeholder="请输入房间密码" maxlength="20" style="flex:1">
          <button id="joinPasswordBtn" class="btn-primary">确认加入</button>
        </div>
      </div>
    </div>

    <div class="card panel room-list-panel">
      <div class="room-list-header">
        <h2>房间列表</h2>
        <button id="refreshRoomsBtn" class="btn-secondary btn-sm">刷新</button>
      </div>
      <div id="roomList" class="room-list">
        <div class="room-list-empty">正在加载房间...</div>
      </div>
    </div>

    <div class="developer-panel">
      <div>
        <h2>开发者信息</h2>
        <p>开发者：<strong>warren</strong></p>
        <p>Email：<a href="mailto:warren.wang0826@gmail.com">warren.wang0826@gmail.com</a></p>
        <p>QQ：1094676771</p>
      </div>
      <a
        class="btn-feedback"
        href="mailto:warren.wang0826@gmail.com?subject=USTC-OnlineCube%20Bug%20Feedback"
      >反馈 Bug</a>
    </div>

    <div id="lobbyError" class="error hidden"></div>
  </div>
</div>

<script type="module" src="app.js?v=10"></script>
</body>
</html>
